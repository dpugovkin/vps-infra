user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 64m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Generic auth rate-limit zone (project-agnostic). Vhosts opt in by applying
    # `limit_req zone=auth_limit burst=5 nodelay;` inside a project-supplied location
    # snippet (see register-project.sh / conf.d/locations/<project>/). 10 MB ≈ 160 000 IPs.
    # nginx is the edge brute-force defence; the container does not read host fail2ban rules.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf;
}
