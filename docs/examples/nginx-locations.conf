# OPTIONAL per-project nginx location policy.
# Ship this as deploy/nginx-locations.conf; register-project.sh installs it into
# conf.d/locations/<project>/ and the vhost includes it INSIDE the 443 server block.
# Use the infra-provided `auth_limit` zone to rate-limit sensitive endpoints.

location = /login {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://myapp:8080;          # = your UPSTREAM
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
