# Minimal wiring to attach your project's app to the shared infra.
# Your app does NOT publish host ports — nginx proxies to it over infra-net.
services:
  myapp:                          # service name = network alias = UPSTREAM host.
                                  # Keep it UNIQUE across the whole box (e.g. = PROJECT_NAME).
    image: your/app:latest
    restart: unless-stopped
    env_file: .env                # your app's own env (incl. the DB_*/REDIS_* connection vars)
    networks:
      - infra-net
    # app listens on 8080 inside the container  ->  UPSTREAM=myapp:8080

networks:
  infra-net:
    external: true
    name: infra-net
