user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Unknown-Host guard: any request whose Host header does not match a
    # registered per-site server{} block is rejected here. This prevents an
    # unregistered or misrouted domain from accidentally matching the first
    # vhost and serving another site's content.
    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    include /etc/nginx/conf.d/*.conf;
}
